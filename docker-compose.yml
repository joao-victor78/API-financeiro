# Banco para desenvolvimento local do módulo Financeiro (PostgreSQL 16).
#   docker compose up -d   → cria os bancos erp e erp_test, usuário financeiro/financeiro
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/criar-banco-teste.sql:/docker-entrypoint-initdb.d/01-teste.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
