# Variáveis do .env (formato CHAVE=valor). Variáveis de ambiente do sistema têm prioridade.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]
spring.application.name=financeiro

server.port=${PORT:3008}
server.servlet.context-path=/api/financeiro
server.error.whitelabel.enabled=false

# Banco: o DataSource é montado a partir de DATABASE_URL (ver ConfiguracaoBanco)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=financeiro
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.schemas=financeiro
spring.flyway.default-schema=financeiro
spring.flyway.create-schemas=true
# Bancos criados pela versão anterior (NestJS) já têm a estrutura: viram a linha de base V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JSON em snake_case, datas ISO-8601 e rejeição de campos desconhecidos (ex.: tenant_id no corpo)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

# Datas na query string no formato ISO (?vencimento_de=2026-10-01)
spring.mvc.format.date=iso

# Mensagens de validação sempre em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Upload do extrato OFX
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

springdoc.api-docs.path=/docs-json
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method

logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off
